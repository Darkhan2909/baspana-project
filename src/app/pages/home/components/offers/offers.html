
  <!-- Offers -->
  <section class="baspana-market__offers">
  <h2>{{title | uppercase}}</h2>
   <form (submit)="onSearch(); $event.preventDefault()" class="baspana-market__offer-form">
    <input
      type="text"
      [(ngModel)]="search"
      name="search"
      class="baspana-market__offer-input"
      placeholder="Введите название объекта"
    />
    <button type="submit" class="baspana-market__offer-button">Поиск</button>
  </form>
  <div class="baspana-market__offer-list">
    @for(offer of offers$ | async; track offer.title) {

    <div
      class="baspana-market__offer-card"
    >
      <img [src]="offer.image" [alt]="offer.title" />
      <h4>{{ offer.price | numberSpaced }}</h4>
      <p>Дата публикации: {{ offer.date | dateFormat }}</p>
      <p>{{ offer.title }}</p>
    </div>
    }
  </div>
</section>
