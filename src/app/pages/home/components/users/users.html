
<h2>Список пользователей</h2>

    <button (click)="store.loadUsers()">Загрузить</button>

    <div *ngIf="store.loading()">Загрузка...</div>
    <div *ngIf="store.error()">{{ store.error() }}</div>

    <ul>
    @for(user of  store.users(); track user.id) {
        <li>
            {{ user.name }} ({{ user.email }})
        </li>  
    }
  
</ul>
